_# === Target Repository ===
target_repo: /workspace/darktable

# === Branch ===
branch: diffuse-perf-cpu

# === Files to Optimise ===
optimisation_target: src/iop/diffuse.c

# === Instructions ===
instructions: instructions.md

# === Commands ===
build_cmd: ./build.sh --prefix /home/developer/darktable-build --build-type Release --install
quality_cmd: /workspace/optimiser/quality_check.sh
bench_cmd: python3 /workspace/optimiser/bench_diffuse_single.py
bench_image: test-data/DSC_9034.NEF
bench_sidecar: test-data/DSC_9034.NEF.xmp
module_name: diffuse

# === Performance Thresholds ===
early_abort_pct: -2
min_improvement_pct: 5
max_regression_pct: 0

# === Targeting ===
# "overall" optimises sum(user); "least_improved_instance" dynamically
# targets the benchmark instance that has improved least since baseline.
#targeting_mode: overall
targeting_mode: least_improved_instance

# === Benchmark Convergence ===
num_warmup_iterations: 0
benchmark_convergence_threshold_pct: 0.1
benchmark_convergence_tail_runs: 5

# === Retry ===
max_retries: 5

# === Termination ===
max_iterations: 999999
max_consecutive_perf_failures: 8888
max_runtime_minutes: 999999

# === Ideas ===
idea_generation_batch_size: 5

# === Git ===
commit_prefix: perf
# Only commit changed files under these path prefixes (comma-separated).
# Prevents accidentally committing unrelated WIP changes in the target repo.
commit_scope: src/iop/

# === AI Providers ===
# Supported providers: claude, gemini
# Comma-separated list of providers to permanently disable.
disabled_providers:
llm_timeout: 3600

# How many times to retry after all providers fail in a single call.
# Each retry waits 2 hours for provider quota to reset.
# 0 = fail immediately (useful for testing). Set high for unattended runs.
providers_retry_limit: 1000
